[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "janus-control-plane"
version = "1.0.0"
description = "API gateway control plane and observability platform, built on Sillo, managing Caddy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Sillo does the framework-level work: routing, middleware, sessions, auth,
    # permissions, the ORM, migrations, validation, the console, the queue and
    # the scheduler. Janus adds a domain on top of it and no framework of its own.
    "sillo-framework[cache,hashing-bcrypt,record]==0.3.2.dev1",
    "sillo-inertia==0.1.0.dev1",
    # The only client Janus needs. Caddy's admin API is plain HTTP, so there is
    # no vendor SDK in the dependency list and no release cadence but Caddy's
    # own that can break this build.
    "httpx>=0.28.1",
    "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29.0"]
redis = ["redis>=5.0.0"]
server = ["uvicorn[standard]>=0.30.0"]
dev = ["pytest>=8.3.5", "pytest-asyncio>=0.25.3", "ruff>=0.6.0"]

[project.scripts]
janus = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "database", "routes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["database/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["E402"]
